<div class="landing-page">

  <main class="landing-content">

    <section class="brand-block">

      <div class="logo-halo">

        <img
          class="landing-logo"
          src="/images/logo-ritmo.png"
          alt="Ritmo"
        >

      </div>

      <p class="frase">
        Viaje no seu ritmo,
        <span>viva cada lugar do seu jeito</span>
      </p>

    </section>


    <section class="action-block">

      <p class="descricao">
        Seu app para descobrir experiências
        que combinam com seu tempo, energia
        e forma de viver o dia!
      </p>

      <button
        type="button"
        class="entrar-button"
        (click)="entrar()"
      >
        Entrar
      </button>

    </section>

  </main>

</div>
