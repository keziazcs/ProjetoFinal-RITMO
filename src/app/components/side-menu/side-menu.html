<div
  class="menu-overlay"
  (click)="fecharMenu()"
>

  <aside
    class="side-menu"
    (click)="$event.stopPropagation()"
  >

    <div class="menu-header">

  <img
    class="menu-logo"
    src="/images/logo-ritmo.png"
    alt="Ritmo"
  >

  <button
    type="button"
    class="close-menu"
    aria-label="Fechar menu"
    (click)="fecharMenu()"
  >
    ×
  </button>

    </div>


    <nav class="menu-nav">

      <button
        type="button"
        (click)="navegar('/home')"
      >
        <span>⌂</span>
        Início
      </button>


      <button
        type="button"
        (click)="navegar('/local')"
      >
        <span>✦</span>
        Encontrar meu Ritmo
      </button>


      <button
        type="button"
        (click)="navegar('/feed')"
      >
        <span>⌕</span>
        Explorar
      </button>


      <button
        type="button"
        (click)="navegar('/favoritos')"
      >
        <span>♡</span>
        Favoritos
      </button>


      <button
        type="button"
        (click)="navegar('/grupos')"
      >
        <span>◌</span>
        Grupos
      </button>


      <button
        type="button"
        (click)="navegar('/perfil')"
      >
        <span>○</span>
        Perfil
      </button>

    </nav>


    <div class="menu-footer">

      <button
        type="button"
        class="logout-button"
        (click)="sair()"
      >
        Sair da conta
      </button>

    </div>

  </aside>

</div>

<div class="menu-footer">

  <div class="menu-divider">
  </div>


  <button
    type="button"
    class="logout-button"
    (click)="sair()"
  >
    <span class="logout-icon">
      ↪
    </span>

    <div>

      <strong>
        Sair da conta
      </strong>

      <small>
        Encerrar esta sessão
      </small>

    </div>

  </button>

</div>
